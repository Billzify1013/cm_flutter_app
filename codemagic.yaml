workflows:
  ios-appstore-workflow:
    name: iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodeMagic Integration
    environment:
      flutter: 3.38.1
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - billzify_appstore_profile
        certificates:
          - billzify_distribution
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Force iOS 15.5 deployment target
        script: |
          cd ios
          sed -i '' "s/# platform :ios.*/platform :ios, '15.5'/" Podfile
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.5'/" Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' Runner.xcodeproj/project.pbxproj
          rm -f Podfile.lock
          cd ..
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Fix bundle identifier after signing
        script: |
          cd ios
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com\.billzify\.cm\.[^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.billzify.cm/g' Runner.xcodeproj/project.pbxproj
      - name: Build IPA for App Store
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/export_options.plist
      - name: Upload dSYM to Crashlytics
        script: |
          cd ios
          find /Users/builder/clone/build/ios/archive/Runner.xcarchive/dSYMs -name "*.dSYM" | while read dsym; do
            ./Pods/FirebaseCrashlytics/upload-symbols -gsp GoogleService-Info.plist -p ios "$dsym" || true
          done
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false